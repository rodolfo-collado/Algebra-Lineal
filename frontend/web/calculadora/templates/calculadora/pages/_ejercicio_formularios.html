<form id="ejercicio-{{ e.id }}-renombrar" method="post" action="{{ pagina }}" hidden>{% csrf_token %}<input type="hidden" name="accion" value="editar_ejercicio"><input type="hidden" name="id" value="{{ e.id }}"><input type="hidden" name="filtros" value="{{ consulta_filtros }}"><input type="hidden" name="volver" value="{{ volver }}#ejercicio-{{ e.id }}"></form>
<form id="ejercicio-{{ e.id }}-disolver" method="post" action="{{ pagina }}" hidden>{% csrf_token %}<input type="hidden" name="accion" value="disolver"><input type="hidden" name="id" value="{{ e.id }}"><input type="hidden" name="filtros" value="{{ consulta_filtros }}"><input type="hidden" name="volver" value="{{ volver }}"></form>
