{% load static %}
<!doctype html>
<html lang="es" data-theme="light">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Álgebra Lineal{% endblock %}</title>
    <link rel="icon" href="{% static 'calculadora/mark.svg' %}" type="image/svg+xml">
    <script>
        (function () {
            var key = "algebra-lineal-tema";
            var stored = localStorage.getItem(key);
            var theme = stored === "light" || stored === "dark"
                ? stored
                : (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
            document.documentElement.setAttribute("data-theme", theme);
            document.documentElement.style.colorScheme = theme;
        })();
    </script>
    <link rel="stylesheet" href="{% static 'calculadora/styles.css' %}">
    {% block extra_head %}{% endblock %}
</head>
<body>
    <a class="skip-link" href="#contenido">Saltar al contenido</a>
    {% include "calculadora/_header.html" %}
    <main id="contenido" class="app-content">
        {% block module_header %}{% endblock %}
        {% block content %}{% endblock %}
    </main>
    <script src="{% static 'calculadora/tema.js' %}" defer></script>
    <script src="{% static 'calculadora/matriz.js' %}" defer></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
