<script>
    (function () {
        var root = document.documentElement;
        var escritura = null;
        // Preferencias de presentación: localStorage durante la sesión y, en la app de
        // escritorio, el archivo propio que el servidor pinta como data-pygebra-… entre aperturas.
        var preferencias = window.preferencias = {
            leer: function (clave) {
                try {
                    var valor = localStorage.getItem(clave);
                    if (valor !== null) return valor;
                } catch (_) { /* Sin almacenamiento queda el valor de escritorio. */ }
                return root.getAttribute("data-" + clave);
            },
            guardar: function (clave, valor) {
                try {
                    localStorage.setItem(clave, valor);
                } catch (_) { /* El cambio vale para esta visita. */ }
                if (!root.hasAttribute("data-desktop")) return;
                root.setAttribute("data-" + clave, valor);
                var token = document.querySelector('meta[name="csrf-token"]');
                var headers = {"X-CSRFToken": token ? token.content : ""};
                try {
                    escritura = JSON.parse(sessionStorage.getItem("pygebra-escrituras")) || escritura;
                } catch (_) { /* Sin almacenamiento el orden vale para esta visita. */ }
                try {
                    if (!escritura || !Number.isSafeInteger(escritura.numero) || escritura.numero < 0) {
                        escritura = {sesion: crypto.randomUUID(), numero: 0};
                    }
                    escritura.numero++;
                    headers["X-PyGebra-Escritura"] = escritura.sesion + ":" + escritura.numero;
                    try { sessionStorage.setItem("pygebra-escrituras", JSON.stringify(escritura)); } catch (_) {}
                } catch (_) { /* Sin identificador, el servidor guarda normalmente. */ }
                // Se envía ya: keepalive también cubre navegar mientras el servidor escribe.
                // El servidor descarta escrituras anteriores que lleguen tarde.
                fetch("/preferencias/", {
                    method: "POST",
                    keepalive: true,
                    headers: headers,
                    body: new URLSearchParams({clave: clave, valor: valor})
                }).catch(function () { /* Sin servidor, vale para esta ejecución. */ });
            }
        };
        var stored = null;
        try {
            stored = localStorage.getItem("pygebra-tema");
            if (stored === null) {
                stored = localStorage.getItem("algebra-lineal-tema");
                if (stored === "light" || stored === "dark") localStorage.setItem("pygebra-tema", stored);
            }
        } catch (_) { /* El tema y el menú funcionan sin almacenamiento. */ }
        if (stored !== "light" && stored !== "dark") stored = preferencias.leer("pygebra-tema");
        var theme = stored === "light" || stored === "dark"
            ? stored
            : (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        root.setAttribute("data-theme", theme);
        root.style.colorScheme = theme;
        // El estilo es independiente del tema: Estudio salvo que se haya elegido Minimalista.
        // Sin JavaScript no hay data-estilo y la interfaz queda en su forma más sobria.
        root.setAttribute("data-estilo", preferencias.leer("pygebra-estilo") === "minimalista" ? "minimalista" : "estudio");
        // Con JavaScript la navegación es un cajón cerrado; la clase evita que asome antes de tiempo.
        root.classList.add("js");
        // Dirección del salto antes del primer pintado: las transiciones y el sonido se
        // acercan al avanzar y se alejan al volver (al historial o a un nivel superior).
        var ruta = location.pathname;
        var nivel = ruta === "/" ? 0 : ruta.indexOf("/areas/") === 0 ? 1 : 2;
        try {
            var activacion = window.navigation && window.navigation.activation;
            var previo = sessionStorage.getItem("pygebra-nivel");
            var atras = activacion && activacion.navigationType === "traverse" && activacion.from
                ? activacion.from.index > activacion.entry.index
                : previo !== null && Number(previo) > nivel;
            root.setAttribute("data-dir", atras ? "atras" : "adelante");
            // Solo se celebra la llegada desde otra página de PyGebra, nunca al recargar.
            if (activacion && activacion.from && activacion.navigationType !== "reload") root.setAttribute("data-llegada", "");
            window.addEventListener("pagehide", function () {
                try { sessionStorage.setItem("pygebra-nivel", String(nivel)); } catch (_) {}
            });
        } catch (_) { /* Sin almacenamiento la transición avanza siempre. */ }
        // Una transición entre páginas que el navegador omite (por ejemplo al saltar a
        // #resultado) no es un error: la página nueva aparece sin animación.
        ["pageswap", "pagereveal"].forEach(function (tipo) {
            window.addEventListener(tipo, function (event) {
                var transicion = event.viewTransition;
                if (transicion) {
                    transicion.ready.catch(function () {});
                    transicion.finished.catch(function () {});
                }
            });
        });
    })();
</script>
