{% comment %}Dock contextual: solo se muestra con JavaScript al enfocar una entrada compatible.{% endcomment %}
{% if perfiles_teclado %}
    {{ perfiles_teclado|json_script:"math-keyboard-profiles" }}
    <div class="math-keyboard" data-perfiles="math-keyboard-profiles"
         role="group" aria-label="Teclado matemático" aria-hidden="true" inert hidden>
        <span class="math-keyboard-title">Teclado matemático</span>
        <div class="math-keyboard-groups"></div>
        <p class="math-keyboard-help"></p>
    </div>
    <template id="math-key-group-template">
        <div class="math-keyboard-group" role="group">
            <span class="math-keyboard-group-name" aria-hidden="true"></span>
            <div class="math-keys"></div>
        </div>
    </template>
    <template id="math-key-template">
        <button type="button" class="math-key" tabindex="-1" data-insercion="" data-retroceso="0"></button>
    </template>
{% endif %}
