{% if form.non_field_errors and not form.grupo_error %}
    <div class="alert error" role="alert" tabindex="-1" data-error-general>{{ form.non_field_errors }}</div>
{% endif %}
{% for campo in form.hidden_fields %}
    {% if campo.errors %}<div class="alert error" role="alert" tabindex="-1" data-error-general>{% for error in campo.errors %}<p>{{ error }}</p>{% endfor %}</div>{% endif %}
{% endfor %}
