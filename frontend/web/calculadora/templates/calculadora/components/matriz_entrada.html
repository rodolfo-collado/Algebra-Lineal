<fieldset class="matrix-entry" data-matriz="{{ nombre }}">
    <legend>Matriz <span data-nombre-matriz>{{ nombre }}</span></legend>
    <div class="matrix">
        <span class="matrix-fence matrix-fence-start" aria-hidden="true"></span>
        <div class="matrix-scroll" tabindex="0" role="region" aria-label="Entradas de la matriz {{ nombre }}">
            <table class="matrix-table matrix-entry-table" aria-label="Matriz {{ nombre }}">
                <tbody>
                    {% for fila in filas %}
                        <tr>{% for campo in fila %}{% include "calculadora/components/matriz_celda.html" %}{% endfor %}</tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
        <span class="matrix-fence matrix-fence-end" aria-hidden="true"></span>
    </div>
</fieldset>
