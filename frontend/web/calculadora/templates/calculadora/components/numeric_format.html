<div class="numeric-format" data-numeric-controls hidden role="group" aria-label="Formato de los resultados">
    <label for="numeric-mode">Formato</label>
    <select id="numeric-mode" data-numeric-mode>
        <option value="exacto">Exacto</option>
        <option value="decimal">Decimal</option>
    </select>
    <label for="numeric-precision" data-numeric-precision-label hidden>Decimales</label>
    <select id="numeric-precision" data-numeric-precision hidden>
        <option value="2">2</option>
        <option value="4" selected>4</option>
        <option value="6">6</option>
        <option value="8">8</option>
    </select>
    <p class="numeric-notice muted" data-numeric-notice role="status" aria-live="polite"></p>
</div>
