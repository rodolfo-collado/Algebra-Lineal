<div class="dimension-field">
    <label for="{{ campo.id_for_label }}">{{ campo.label }}</label>
    <div class="stepper" data-estructura="{{ campo.name }}">
        <button type="button" class="stepper-btn" data-paso="-1" aria-label="{{ quitar }}" hidden>−</button>
        {{ campo }}
        <button type="button" class="stepper-btn" data-paso="1" aria-label="{{ agregar }}" hidden>+</button>
    </div>
    {{ campo.errors }}
</div>
