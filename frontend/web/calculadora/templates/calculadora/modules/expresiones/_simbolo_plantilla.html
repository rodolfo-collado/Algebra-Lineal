<article class="symbol-card" data-simbolo>
    <div class="symbol-head">
        <div class="field-group">
            <label>Nombre</label>
            <input type="text" class="field-input symbol-field-name" autocomplete="off" spellcheck="false" maxlength="12" data-campo="nombre" value="A">
        </div>
        <div class="field-group">
            <label>Tipo</label>
            <select class="field-input symbol-field-type" data-campo="tipo">
                <optgroup label="Con valores">
                    <option value="matriz" selected>Matriz</option>
                    <option value="vector">Vector</option>
                    <option value="escalar">Escalar</option>
                </optgroup>
                <optgroup label="Simbólicos">
                    <option value="matriz_desconocida">Matriz desconocida</option>
                    <option value="vector_simbolico">Vector simbólico</option>
                    <option value="vector_lineal">Vector lineal</option>
                </optgroup>
            </select>
        </div>
        <div class="dimension-field" data-dimension="filas">
            <label>Filas</label>
            <div class="stepper">
                <button type="button" class="stepper-btn" data-paso="-1" aria-label="Quitar una fila">−</button>
                <input type="number" class="field-input" min="1" max="10" value="2" data-campo="filas" inputmode="numeric">
                <button type="button" class="stepper-btn" data-paso="1" aria-label="Agregar una fila">+</button>
            </div>
        </div>
        <div class="dimension-field" data-dimension="columnas">
            <label>Columnas</label>
            <div class="stepper">
                <button type="button" class="stepper-btn" data-paso="-1" aria-label="Quitar una columna">−</button>
                <input type="number" class="field-input" min="1" max="10" value="2" data-campo="columnas" inputmode="numeric">
                <button type="button" class="stepper-btn" data-paso="1" aria-label="Agregar una columna">+</button>
            </div>
        </div>
        <button class="btn btn-secondary" type="submit" data-eliminar>Eliminar</button>
    </div>
    <p class="field-help" data-nota hidden></p>
    <div class="matrix" data-rejilla>
        <div class="matrix-scroll">
            <div class="matrix-content">
            <span class="matrix-fence matrix-fence-start" aria-hidden="true"></span>
            <table class="matrix-table matrix-entry-table"><tbody>
                <tr><td></td><td></td></tr>
                <tr><td></td><td></td></tr>
            </tbody></table>
            <span class="matrix-fence matrix-fence-end" aria-hidden="true"></span>
            </div>
        </div>
    </div>
</article>
