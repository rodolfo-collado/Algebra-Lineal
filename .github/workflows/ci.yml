name: CI

on:
  workflow_call:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read

# Los PR/develop cancelan CI obsoleto; el CI de Release queda aislado por ejecución.
concurrency:
  group: ci-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verificaciones:
    name: Pruebas y verificaciones
    runs-on: ubuntu-latest

    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Instalar uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.7"
          enable-cache: true

      - name: Comprobar que uv.lock coincide con pyproject.toml
        run: uv lock --check

      # La version de Python sale de .python-version; uv la instala si falta.
      - name: Preparar el entorno desde el lockfile
        run: uv sync --locked

      - name: Ejecutar las pruebas
        run: uv run --locked python -m unittest discover -v

      - name: Comprobar configuración Django
        run: uv run --locked python manage.py check

      - name: Verificar la compilacion
        run: uv run --locked python -m compileall -q actualizador backend frontend tests main.py manage.py desktop.py

  windows:
    name: Distribución de Windows
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Instalar uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.7"
          enable-cache: true

      - name: Instalar Inno Setup 6.7.3
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $directory = Join-Path $env:LOCALAPPDATA 'Programs\Inno Setup 6'
          New-Item -ItemType Directory -Path build\tools -Force | Out-Null
          $installer = Join-Path $PWD 'build\tools\innosetup.exe'
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe' -OutFile $installer
          $signature = Get-AuthenticodeSignature -LiteralPath $installer
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'O=Pyrsys B.V.(?:,|$)') {
            throw 'La firma del instalador de Inno Setup no es válida.'
          }
          $process = Start-Process $installer -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER', ('/DIR="' + $directory + '"'), '/TASKS=') -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Inno Setup falló: $($process.ExitCode)" }

      - name: Construir aplicación e instalador
        shell: pwsh
        run: .\scripts\build_windows.ps1

      - name: Ejecutar las pruebas en Windows
        run: uv run --locked python -m unittest discover -v

      - name: Probar instalación, dos aperturas y desinstalación
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem dist/installer/PyGebra-Setup-*.exe)
          if ($installers.Count -ne 1) { throw 'Se esperaba exactamente un instalador.' }
          .\scripts\test_windows_distribution.ps1 -InstallerPath $installers[0].FullName

      # La prueba anterior desinstaló todo: la cuenta vuelve a estar limpia.
      - name: Probar actualización desde la última release publicada
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $directory = Join-Path $env:RUNNER_TEMP 'release-anterior'
          New-Item -ItemType Directory -Path $directory -Force | Out-Null
          # Sin tag, gh descarga la release estable marcada como más reciente.
          gh release download --repo $env:GITHUB_REPOSITORY --pattern 'PyGebra-Setup-*.exe' --pattern SHA256SUMS.txt --dir $directory
          if ($LASTEXITCODE -ne 0) { throw 'No se pudo descargar la última release publicada.' }
          $previous = @(Get-ChildItem -LiteralPath $directory -Filter 'PyGebra-Setup-*.exe')
          if ($previous.Count -ne 1) { throw 'Se esperaba exactamente un instalador publicado.' }
          # Misma verificación que hace el actualizador antes de ejecutar un instalador.
          $line = @(Get-Content -LiteralPath (Join-Path $directory 'SHA256SUMS.txt') | Where-Object { ($_ -split '\s+')[1] -eq $previous[0].Name })
          if ($line.Count -ne 1) { throw 'SHA256SUMS.txt no tiene una entrada única para el instalador publicado.' }
          if ((Get-FileHash -LiteralPath $previous[0].FullName -Algorithm SHA256).Hash -ne ($line[0] -split '\s+')[0]) { throw 'El instalador publicado no coincide con su SHA-256.' }
          $installers = @(Get-ChildItem dist/installer/PyGebra-Setup-*.exe)
          if ($installers.Count -ne 1) { throw 'Se esperaba exactamente un instalador.' }
          .\scripts\test_windows_distribution.ps1 -InstallerPath $installers[0].FullName -PreviousInstallerPath $previous[0].FullName -PreviousDesktopIcon

      - name: Conservar instalador para revisión
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: algebra-lineal-windows
          path: dist/installer/PyGebra-Setup-*.exe
          if-no-files-found: error
          retention-days: 14
